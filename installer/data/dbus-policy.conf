<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root owns the installer backend; only root and the UI's user call it. -->
<busconfig>
  <policy user="root">
    <allow own="software.shapebit.Installer1"/>
    <allow send_destination="software.shapebit.Installer1"/>
  </policy>
  <policy user="installer">
    <allow send_destination="software.shapebit.Installer1"/>
  </policy>
</busconfig>
