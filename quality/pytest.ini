[pytest]
# The checks of the built OS (README.md): check_*.py, beside what they check,
# each file marked with where it runs; make picks them by marker. test_*.py
# are unit tests, which need no image and run with `make test-unit`. A check
# uses only the fixtures (fixtures.py), never machine.py, the fixtures' own.
# The fixtures load by their package path: pytest has a plugin of its own named
# fixtures. quality/ is on the path for their import of machine.py. Testinfra
# is a library here; its plugin's own host fixture would test this machine.
addopts = -ra --tb=short -v --strict-markers -p quality.fixtures -p no:pytest11.testinfra -p no:cacheprovider
pythonpath = . quality
python_files = check_*.py
markers =
    image: a container of the image, where nothing boots (make test-image)
    medium: the booted installer medium, before it installs (make disk)
    installed: the installed, running system (make test, test-update, test-guest)
    update: the update test, around the installed system's checks (make test-update)
