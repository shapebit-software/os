# The desktop's portals (portals.conf(5)), installed as shapebit-portals.conf
# for the desktop name ShapeBit: Hyprland's, for sharing the screen, with the
# shell's picker (xdph.conf), and global shortcuts; gnome-keyring's, for
# secrets; and the shell's for everything else (shell.portal), which the
# shell shows: files, screenshots, opening with an application,
# permissions, the person's details, running in the background, launchers,
# the wallpaper, and notifications; and keeping awake and the settings, such
# as the window buttons (window-buttons.gschema.override). Printing and email
# are not offered yet.
[preferred]
default=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=shell
org.freedesktop.impl.portal.Screenshot=shell
org.freedesktop.impl.portal.AppChooser=shell
org.freedesktop.impl.portal.Access=shell
org.freedesktop.impl.portal.Account=shell
org.freedesktop.impl.portal.Background=shell
org.freedesktop.impl.portal.DynamicLauncher=shell
org.freedesktop.impl.portal.Inhibit=shell
org.freedesktop.impl.portal.Notification=shell
org.freedesktop.impl.portal.Settings=shell
org.freedesktop.impl.portal.Wallpaper=shell
