<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts for make run: the system's, and those the OS image ships
     (../rootfs), such as Instrument Sans, which the development container
     lacks. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../rootfs/usr/share/fonts</dir>
</fontconfig>
