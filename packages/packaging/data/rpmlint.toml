# rpmlint's findings that ShapeBit's own packages accept, each with the reason;
# every other finding fails the image build (image/Containerfile). See
# rpmlint's own documentation for each name.
Filters = [
    # Our packages are built from the repository at the image's version; git
    # is their changelog, as their release notes are made from it.
    'no-changelogname-tag',
    # ShapeBit's own license is not on Fedora's list of licenses.
    'invalid-license',
    # shapebit-system only requires the features; it installs nothing itself.
    'shapebit-system.noarch: E: no-binary',
    'shapebit-system.noarch: W: no-documentation',
    # Summaries and descriptions name programs and formats, such as Flathub,
    # TOML, bootc, and Hyprland, which no dictionary knows.
    'spelling-error',
    # Qt finds QML modules only in its own folder, which is under /usr/lib64;
    # the module itself is text, the same on every architecture.
    'shapebit-colors.noarch: E: noarch-with-lib64',
]
