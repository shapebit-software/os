# The network feature's Rust programs, built with Fedora's crates (../cargo.mk).
[package]
name = "network"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "connection-agent"
path = "src/main.rs"

[dependencies]
async-channel = "2"
async-executor = "1"
async-io = "2"
futures-lite = "2"
serde = "1"
serde_json = "1"
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
