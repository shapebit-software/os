# The license of every file in this repository, in the REUSE format
# (https://reuse.software): the texts are in LICENSES/, and `make validate`
# checks with `reuse lint` that every file has one. When several annotations
# match a file, the last one counts, so the default comes first.
#
# Each own package's License tag names the licenses of the files it installs
# (packages/test_licenses.py).
version = 1
SPDX-PackageName = "ShapeBit OS"
SPDX-PackageSupplier = "Marcin Syngajewski"
SPDX-PackageDownloadLocation = "https://github.com/shapebit-software/os"

# Everything else: programs, such as the shell, the system, and updates.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Marcin Syngajewski"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Code that other programs embed: the QML module Colors.
[[annotations]]
path = "packages/colors/**"
SPDX-FileCopyrightText = "Marcin Syngajewski"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Documentation: the guidebook and the READMEs, with the guidebook's screenshots.
[[annotations]]
path = ["**/*.md", "guidebook/**"]
SPDX-FileCopyrightText = "Marcin Syngajewski"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Configuration and snippets that people copy: each feature's system settings,
# the compositor's configuration, the boot splash's theme, the Fedora remote's
# filter, keys, and the assistant's built-in skills.
[[annotations]]
path = [
  "packages/*/system/**",
  "packages/windows/**",
  "packages/login/src/compositor.lua",
  "packages/splash/data/boot.plymouth",
  "packages/apps/data/fedora.filter",
  "packages/**/*.asc",
  "packages/**/*.pub",
  "packages/assistant/data/skills/**",
]
SPDX-FileCopyrightText = "Marcin Syngajewski"
SPDX-License-Identifier = "MIT"

# Brand artwork: the logo and wordmark, which no open license covers.
[[annotations]]
path = ["packages/splash/data/watermark.png", "packages/installer/src/ui/images/*.png"]
SPDX-FileCopyrightText = "Marcin Syngajewski"
SPDX-License-Identifier = "LicenseRef-ShapeBit-Brand"

# Others' work.
[[annotations]]
path = "packages/font/data/**"
SPDX-FileCopyrightText = "2022 The Instrument Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packages/licenses/data/notices/shim-x64/COPYRIGHT"
SPDX-FileCopyrightText = ["2012 Red Hat, Inc", "2009-2012 Intel Corporation"]
SPDX-License-Identifier = "BSD-2-Clause"
