# Builds the image and tests its files, the one thing that the earlier stages
# cannot see. Publishes nothing, and signs with a throwaway key. Called by
# Verification when the image's recipe changes.
name: "Stage: Image tests"

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  ENGINE: docker
  # The foundation that Candidate published last (images/README.md#foundation),
  # which make takes when what the specs require is unchanged.
  FOUNDATION_CACHE: ghcr.io/shapebit-software/os/foundation:latest

jobs:
  image-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/disk-space
      - uses: ./.github/actions/ghcr-login
      - name: Build and test the image
        run: make test-image
