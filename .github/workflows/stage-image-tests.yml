# Builds the image and tests its files, the one thing that the earlier stages
# cannot see. Publishes nothing, and signs with a throwaway key. Called by
# Verification when the image's recipe changes.
name: "Stage: Image tests"

on:
  workflow_call:

permissions:
  contents: read

env:
  ENGINE: docker

jobs:
  image-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune -af >/dev/null
      - uses: actions/checkout@v4
      - name: Build and test the image
        run: make test-image
