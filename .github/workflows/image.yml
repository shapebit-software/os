# Builds the OS image from the pinned image, desktop, and installer, pushes it
# to GHCR as a candidate (os:sha-<commit>), installs it from the installer
# medium in QEMU, checks the installed system and an update, and then moves
# os:dev to it. The tested medium is kept as an artifact, from which the
# Release workflow publishes it. Runs on every push to main, and weekly, so
# that the image picks up Fedora's updates without a new commit.
name: Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  ENGINE: docker
  REPOSITORY: ghcr.io/shapebit-software/os

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # The build and the test disks need about 30 GB; the runner's
      # preinstalled toolchains are not used.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      # .gitmodules names the repositories over SSH; they are public over HTTPS.
      - name: Check out the image, desktop, and installer
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 image desktop installer

      - name: Install QEMU, firmware, and a software TPM
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy qemu-system-x86 ovmf swtpm swtpm-tools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same development key signs every build, so installed systems
      # update without a new TPM enrollment. Without the secret, as in forks,
      # make generates new ones.
      - name: Restore the signing key
        env:
          DEV_SIGNING_KEY: ${{ secrets.DEV_SIGNING_KEY }}
        run: |
          mkdir -p image/build/keys
          if [ -n "$DEV_SIGNING_KEY" ]; then base64 -d <<<"$DEV_SIGNING_KEY" | tar -xz -C image/build/keys; fi

      # A rolling release: the build date and the commit.
      - name: Set the image version
        run: echo "IMAGE_VERSION=$(date -u +%Y%m%d)_${GITHUB_SHA::6}" >>"$GITHUB_ENV"

      - name: Build and check the image
        run: make -C image check

      - name: Push the candidate
        run: |
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          skopeo copy -q oci-archive:image/build/image.tar "docker://$REPOSITORY:sha-$GITHUB_SHA"

      - name: Install from the medium and check the installed system
        run: make -C image test

      # Keep the medium that the test installed from, before the update test
      # builds a newer image.
      - name: Compress the tested medium
        run: zstd -q -T0 -10 image/build/installer.raw -o installer.raw.zst

      - name: Check an update and its rollback
        run: make -C image test-update

      - name: Keep the tested medium
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer.raw.zst
          compression-level: 0
          retention-days: 30

      - name: Move os:dev to the candidate
        run: skopeo copy -q --preserve-digests "docker://$REPOSITORY:sha-$GITHUB_SHA" "docker://$REPOSITORY:dev"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: image/build/*.log
          if-no-files-found: ignore
