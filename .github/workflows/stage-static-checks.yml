# The first stage: lints and validates, without building or running the code.
# Called by Verification and Candidate. Uses no secrets.
name: "Stage: Static checks"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora-toolbox:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fedora-dev
      - name: Lint
        run: make lint
      - name: Validate
        if: ${{ !cancelled() }}
        run: make validate
