# The first stage: lints and validates, without building or running the code.
# Called by Verification and Candidate. Uses no secrets.
name: "Stage: Static checks"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    env:
      ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the development image (development/Containerfile), as on a developer's computer.
      - name: Development image
        run: make dev-image
      - name: Lint
        run: make lint
      - name: Validate
        if: ${{ !cancelled() }}
        run: make validate
