# Temporary: finds out why a Weekly run's medium cannot open its payload, without
# downloading the medium anywhere else. Boots the medium of the given run, tries
# the payload, and keeps the kernel's account of it. Installs nothing.
name: Diagnose medium

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The Weekly run whose medium to check
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vm-host
      - uses: actions/download-artifact@v4
        with:
          name: installer
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the medium
        run: |
          mkdir -p build
          zstd -q -d --rm installer.raw.zst -o build/installer.raw
          mv installer.raw.json build/
      - name: Check the payload in the booted medium
        run: |
          cat >"$RUNNER_TEMP/guest.sh" <<'GUEST'
          uname -r
          findmnt -n -o SOURCE,FSTYPE,OPTIONS /
          ls -l /usr/share/installer/image.tar
          echo "--- open and read through the root"
          dd if=/usr/share/installer/image.tar of=/dev/null bs=1M; echo "dd exit: $?"
          echo "--- the files behind the root"
          mkdir -p /run/top
          mount -o ro,subvol=@base /dev/disk/by-label/installer /run/top
          find /run/top -xdev -type f -size +500M -exec ls -l {} \; -exec lsattr {} \; -exec sha256sum {} \;
          btrfs device stats /run/top
          echo "--- kernel"
          journalctl -k --no-pager | grep -iE 'overlay|verity|btrfs|erofs|composefs|I/O error|csum'
          dmesg | tail -n 40
          GUEST
          cat >"$RUNNER_TEMP/diagnose.sh" <<'HOST'
          set -euo pipefail
          uname -r
          grep -E 'CONFIG_FS_VERITY|CONFIG_BTRFS_FS=' "/boot/config-$(uname -r)"
          truncate -s "$DISK_SIZE" "$DISK"
          scripts/vm.sh --installer --background
          scripts/ssh.sh bash -s <"$RUNNER_TEMP/guest.sh"
          scripts/vm.sh --stop
          HOST
          mkdir -p diagnosis
          make build/ssh/id_ed25519
          make --eval='diagnose: ; bash "$$RUNNER_TEMP/diagnose.sh"' diagnose 2>&1 | tee diagnosis/report.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis
          path: |
            diagnosis
            build/serial.log
          if-no-files-found: ignore
