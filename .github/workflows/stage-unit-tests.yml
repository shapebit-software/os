# The second stage: tests that need no image, no VM, and no secrets. Called by
# Verification and Candidate.
name: "Stage: Unit tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    env:
      ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the development image (development/Containerfile), as on a developer's computer.
      - name: Development image
        run: make dev-image
      - name: Unit tests
        run: make test-unit
