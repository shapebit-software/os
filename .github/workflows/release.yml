# Releases the candidate of the draft release, which the Candidate workflow
# tested: copies os/candidate:<version> and its sources, unchanged, to the public
# os:<version> and os:<version>-sources, then the image to os:stable, which
# installed systems update from, and publishes its release. With "Undo", instead
# copies the release before, os:<version>, back to os:stable, and marks the last
# release withdrawn. Runs only by hand, in the environment "Release", which can
# require a person's approval (Settings > Environments). If a step fails, running
# the workflow again finishes the job. Each run then deletes the versions of os
# that are no longer needed (Prune).
name: Release

on:
  workflow_dispatch:
    inputs:
      undo:
        description: Undo the last release instead
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: os-releases
  cancel-in-progress: false

env:
  REPOSITORY: ghcr.io/shapebit-software/os
  CANDIDATES: ghcr.io/shapebit-software/os/candidate
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/ghcr-login

      # The release to undo is the one marked latest, and it goes back to the
      # newest release before it that is not withdrawn. Withdrawn first: until the
      # previous release is the latest, a repeat of this step still finds the
      # withdrawn one.
      - name: Undo the last release
        if: inputs.undo
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName,name --jq \
            "[.[] | select(.tagName < \"$latest\" and (.name | endswith(\"(withdrawn)\") | not)) | .tagName] | max // empty")
          if [ -z "$previous" ]; then
            echo "::error::$latest has no earlier release to go back to"
            exit 1
          fi
          if ! skopeo inspect --raw "docker://$REPOSITORY:$previous" >/dev/null; then
            echo "::error::$REPOSITORY:$previous no longer exists"
            exit 1
          fi
          if [ "$(gh release view "$latest" --json name --jq .name)" != "$latest (withdrawn)" ]; then
            body=$(gh release view "$latest" --json body --jq .body)
            gh release edit "$latest" --title "$latest (withdrawn)" --notes "**Withdrawn:** installed systems went back to $previous.

          $body"
          fi
          skopeo copy -q --preserve-digests "docker://$REPOSITORY:$previous" "docker://$REPOSITORY:stable"
          gh release edit "$previous" --latest

      # Only a draft can be released: Candidate writes one for each candidate that
      # passed, and a release that was undone is no longer a draft, so it cannot
      # go out again. The version and commit are those that were tested, as main
      # may have moved since.
      - name: Find the candidate's draft release
        if: ${{ !inputs.undo }}
        run: |
          version=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName] | max // empty')
          if [ -z "$version" ]; then
            echo "::error::There is no draft release; run Candidate"
            exit 1
          fi
          inspect() { skopeo inspect "docker://$CANDIDATES:$version" --format "$1"; }
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "REVISION=$(inspect '{{index .Labels "org.opencontainers.image.revision"}}')" >>"$GITHUB_ENV"
          # A candidate left waiting misses security fixes.
          age=$(( ($(date +%s) - $(date -d "$(inspect '{{.Created}}')" +%s)) / 86400 ))
          if [ "$age" -gt 14 ]; then echo "::warning::The candidate is $age days old"; fi

      # The sources first, so that they are public before the image is.
      - name: Copy the candidate and its sources to os:<version>, and to os:stable
        if: ${{ !inputs.undo }}
        run: |
          skopeo copy -q --preserve-digests "docker://$CANDIDATES:$VERSION-sources" "docker://$REPOSITORY:$VERSION-sources"
          skopeo copy -q --preserve-digests "docker://$CANDIDATES:$VERSION" "docker://$REPOSITORY:$VERSION"
          skopeo copy -q --preserve-digests "docker://$REPOSITORY:$VERSION" "docker://$REPOSITORY:stable"

      - name: Publish the release
        if: ${{ !inputs.undo }}
        run: gh release edit "$VERSION" --draft=false --latest --target "$REVISION"

  # What is no longer downloadable for a reason is deleted, with its sources.
  prune:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prune.yml
