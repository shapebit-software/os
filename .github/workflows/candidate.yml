# Runs the first stages of Verification, then builds one OS image a week, or when
# started by hand, and pushes it to the private os/candidate:<version>, which the
# test jobs pull. They install stable with the installer on the download site
# (os/installer:stable), update to the candidate, and test it: the path that
# existing systems take. Only if every test passes does it write a draft release
# of its notes, for the Release workflow. Its sources are collected as it is
# built, to os/candidate:<version>-sources. The build has no cache, so that it picks
# up Fedora's updates; only the build job has the release key, in the environment
# "Signing"; a failed test job can be re-run on the same build (docs/Testing.md).
# Actions artifacts, which anyone signed in to GitHub can download, hold test
# results only, never an image. "Bootstrap" is for when no installer exists yet,
# and so nothing to update from: it skips the update tests, and the Installer
# workflow tests the release in full before anyone can download an installer.
name: Candidate

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: No installer exists yet; skip the update tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: os-releases
  cancel-in-progress: false

env:
  ENGINE: docker
  REPOSITORY: ghcr.io/shapebit-software/os
  CANDIDATES: ghcr.io/shapebit-software/os/candidate

jobs:
  static-checks:
    name: Static checks
    uses: ./.github/workflows/stage-static-checks.yml

  unit-tests:
    name: Unit tests
    needs: static-checks
    uses: ./.github/workflows/stage-unit-tests.yml

  build:
    name: Build and sign
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: Signing
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/image-store
      - uses: ./.github/actions/ghcr-login

      - name: Check that bootstrapping is needed
        if: inputs.bootstrap
        run: |
          if skopeo inspect --raw docker://ghcr.io/shapebit-software/os/installer:stable >/dev/null 2>&1; then
            echo "::error::os/installer:stable exists: update tests can run, so there is nothing to bootstrap"
            exit 1
          fi

      # Outside build/, which the installer's build context holds.
      - name: Restore the release key
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then echo "::error::RELEASE_KEY is not set"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          base64 -d <<<"$RELEASE_KEY" | tar -xz -C "$RUNNER_TEMP/keys"
          echo "KEYS_DIR=$RUNNER_TEMP/keys" >>"$GITHUB_ENV"
          echo "SIGNING_KEY=release" >>"$GITHUB_ENV"

      # A rolling release: when the build started, in UTC.
      - name: Set the image version
        id: version
        run: |
          version=$(date -u +%Y%m%d%H%M)
          echo "IMAGE_VERSION=$version" >>"$GITHUB_ENV"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build and test the image
        run: make test-image

      # The build that the update test moves on to from the candidate, so that the
      # candidate's own os-update downloads one.
      - name: Build the update test's image
        run: make update-builds UPDATE_TAGS=next2

      - name: Remove the release key
        run: rm -rf "$RUNNER_TEMP/keys"

      # The digest that the tests compare with the booted system, unchanged.
      - name: Push the images to os/candidate
        id: push
        run: |
          digest=$(python3 scripts/provenance.py digest build/image.tar)
          skopeo copy -q --preserve-digests oci-archive:build/image.tar "docker://$CANDIDATES:$IMAGE_VERSION"
          [ "$(skopeo inspect "docker://$CANDIDATES:$IMAGE_VERSION" --format '{{.Digest}}')" = "$digest" ]
          skopeo copy -q --preserve-digests oci-archive:build/image-next2.tar "docker://$CANDIDATES:$IMAGE_VERSION-update"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      # COPR deletes old builds, and Fedora's repositories drop a version once an
      # update replaces it, so the sources are collected now, while they match
      # the build (docs/License.md). Release publishes them with the image.
      - name: Collect and push the image's sources
        run: |
          stable=$(skopeo inspect "docker://$REPOSITORY:stable" --format '{{index .Labels "org.opencontainers.image.version"}}' || true)
          make -o image sources ${stable:+SOURCES_PREVIOUS=$REPOSITORY:$stable-sources}
          scripts/sources.py push build/sources "$CANDIDATES:$IMAGE_VERSION-sources" "ShapeBit $IMAGE_VERSION: sources"

  # Install stable without the UI, update to the candidate through the update
  # registry, run the system checks on it, then update again and roll back.
  scripted:
    name: Test the update from stable
    needs: build
    if: ${{ !inputs.bootstrap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/vm-host
      - uses: ./.github/actions/ghcr-login
      - name: Pull the installer of the download site, and the candidate
        run: |
          make pull-installer
          skopeo copy -q --preserve-digests "docker://$CANDIDATES:$VERSION" oci-archive:build/image.tar
          skopeo copy -q --preserve-digests "docker://$CANDIDATES:$VERSION-update" oci-archive:build/image-next2.tar
      - name: Install stable from the medium
        run: make -o installer disk
      - name: Update to the candidate, test it, update again, and roll back
        run: make -o disk -o update-builds test-update NEXT_ARCHIVE=build/image.tar
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-scripted-${{ github.run_attempt }}
          path: build/results
          if-no-files-found: ignore

  # Install stable through the installer's UI, update to the candidate, and test
  # the candidate's desktop, with openQA.
  openqa:
    name: Test the candidate's desktop
    needs: build
    if: ${{ !inputs.bootstrap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/vm-host
      - uses: ./.github/actions/ghcr-login
      - name: Pull the installer of the download site, and the candidate
        run: |
          make pull-installer
          skopeo copy -q --preserve-digests "docker://$CANDIDATES:$VERSION" oci-archive:build/image.tar
      - name: Update to the candidate and test its desktop with openQA
        run: make test-release FLOW=update UPDATE_ARCHIVE=build/image.tar
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-openqa-${{ github.run_attempt }}
          path: build/results
          if-no-files-found: ignore

  publish:
    name: Write the draft release
    needs: [build, scripted, openqa]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (inputs.bootstrap || (needs.scripted.result == 'success' && needs.openqa.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ghcr-login

      - name: Report the changes since os:stable
        run: |
          inspect() { skopeo inspect "docker://$REPOSITORY:$1" --format "{{index .Labels \"$2\"}}"; }
          list() { docker run --rm "$1" rpm -qa --qf '%{NAME} %{VERSION}-%{RELEASE}\n' | sort; }
          list "$CANDIDATES:$VERSION" >packages.txt
          : >old-packages
          range=HEAD
          if stable=$(inspect stable org.opencontainers.image.revision 2>/dev/null); then
            list "$REPOSITORY:stable" >old-packages
            # A stable image from before the revision label has no commit to compare.
            if [ -n "$stable" ] && [ "$stable" != "<no value>" ]; then range=$stable..HEAD; fi
          fi
          git log --oneline "$range" >commits
          python3 scripts/release-notes.py "$DIGEST" "$REPOSITORY:$VERSION-sources" "$GITHUB_SHA" commits \
            old-packages packages.txt >notes.md
          if [ "$BOOTSTRAP" = true ]; then
            { echo "**Bootstrap:** not tested by an update, as no installer existed; the Installer workflow tests it in full."
              echo; cat notes.md; } >notes.new && mv notes.new notes.md
          fi
          { echo "# Candidate $VERSION"; echo; cat notes.md; } >>"$GITHUB_STEP_SUMMARY"

      # Only the latest candidate can be released, so only it keeps a draft.
      - name: Replace the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r draft; do gh release delete "$draft" --yes; done
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md \
            packages.txt
