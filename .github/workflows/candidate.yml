# Builds one OS image a week, or when started by hand, and tests it on the path
# that existing systems take (distribution/README.md#steps): the installer on the
# download site (os/installer:stable) installs stable, which updates to the
# candidate. The candidate goes to the private os/candidate:<version>, which
# the test jobs pull, with its sources and SBOM (distribution/release.py candidate).
# Only if every test passes does it write the draft release, with the
# candidate's record, for the Release workflow. Its first job builds the
# foundation without a cache, so that it picks up Fedora's updates, and pushes
# it to os/foundation, as latest, which every later job and Verification take
# (image/README.md#foundation). Only the build job has the release keys, in
# the environment "Signing", and only while it builds. "Bootstrap" is for when
# no installer exists yet, and so nothing to update from: it skips the update
# tests, and the Installer workflow tests the release in full before anyone
# can download an installer.
name: Candidate

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: No installer exists yet; skip the update tests
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: os-releases
  cancel-in-progress: false

env:
  ENGINE: docker
  FOUNDATION_CACHE: ghcr.io/shapebit-software/os/foundation:latest

# Named, the shell runs with -o pipefail, so that a failing command piped to
# tee fails its step; unnamed, it runs with -e alone.
defaults:
  run:
    shell: bash

jobs:
  foundation:
    name: Build the foundation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      FOUNDATIONS: ghcr.io/shapebit-software/os/foundation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner
      - name: Build the foundation without a cache, and push it
        run: |
          make foundation FOUNDATION_FRESH=1 FOUNDATION="$FOUNDATIONS:$GITHUB_SHA"
          docker tag "$FOUNDATIONS:$GITHUB_SHA" "$FOUNDATIONS:latest"
          docker push -q "$FOUNDATIONS:$GITHUB_SHA"
          docker push -q "$FOUNDATIONS:latest"

  checks:
    name: Static checks and unit tests
    needs: foundation
    uses: ./.github/workflows/checks.yml

  build:
    name: Build and sign
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: Signing
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner

      - name: Check that bootstrapping is needed
        if: inputs.bootstrap
        run: |
          if skopeo inspect --raw docker://ghcr.io/shapebit-software/os/installer:stable >/dev/null 2>&1; then
            echo "::error::os/installer:stable exists: update tests can run, so there is nothing to bootstrap"
            exit 1
          fi

      # A rolling release: when the build started, in UTC.
      - name: Set the image version
        id: version
        run: |
          version=$(date -u +%Y%m%d%H%M)
          echo "IMAGE_VERSION=$version" >>"$GITHUB_ENV"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The keys are on the runner only for the builds that sign, never while
      # tests run (signing/README.md).
      - uses: ./.github/actions/release-keys
        with:
          secureboot-key: ${{ secrets.RELEASE_SECUREBOOT_KEY }}
          pcr-key: ${{ secrets.RELEASE_PCR_KEY }}

      # With the build that the update test moves on to from the candidate, so
      # that the candidate's own os-update downloads one. The test machine
      # trusts only the release key, so it signs this private, test-only image too.
      - name: Build the image, and the update test's
        run: make image update-builds UPDATE_TAGS=next2

      - name: Remove the release keys
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Test the image
        run: make test-system-image SKIP=image

      - name: Push the candidate, with its sources and SBOM
        id: push
        run: distribution/release.py candidate "$IMAGE_VERSION" localhost/shapebit-os:dev build/image.tar build/image-next2.tar >>"$GITHUB_OUTPUT"

  # Install stable without the UI, update to the candidate through the update
  # registry, run the system tests on it, then update again and roll back.
  scripted:
    name: Test the update from stable
    needs: build
    if: ${{ !inputs.bootstrap }}
    uses: ./.github/workflows/vm-test.yml
    with:
      results: results-scripted
      pull: |
        make pull-installer
        skopeo copy -q --preserve-digests "docker://ghcr.io/shapebit-software/os/candidate:${{ needs.build.outputs.version }}" oci-archive:build/image.tar
        skopeo copy -q --preserve-digests "docker://ghcr.io/shapebit-software/os/candidate:${{ needs.build.outputs.version }}-update" oci-archive:build/image-next2.tar
      run: |
        make disk SKIP=installer
        make test-system-update SKIP="disk update-builds" NEXT_ARCHIVE=build/image.tar

  # Install stable without the UI, whose screens its own release tested, update
  # to the candidate, and test the candidate's desktop, with openQA.
  openqa:
    name: Test the candidate's desktop
    needs: build
    if: ${{ !inputs.bootstrap }}
    uses: ./.github/workflows/vm-test.yml
    with:
      results: results-openqa
      pull: |
        make pull-installer
        skopeo copy -q --preserve-digests "docker://ghcr.io/shapebit-software/os/candidate:${{ needs.build.outputs.version }}" oci-archive:build/image.tar
      run: make test-e2e FLOW=update UPDATE_ARCHIVE=build/image.tar

  draft:
    name: Write the draft release
    needs: [build, scripted, openqa]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (inputs.bootstrap || (needs.scripted.result == 'success' && needs.openqa.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner
      - name: Write the draft release, with the candidate's record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          distribution/release.py draft "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.digest }}"
          ${{ inputs.bootstrap && '--bootstrap' || '' }}
