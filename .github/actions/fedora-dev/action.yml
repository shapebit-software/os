# The Fedora of the image, with the development packages of distrobox.ini, which
# static checks and unit tests run in.
name: Fedora development packages
description: Install the development packages of distrobox.ini
runs:
  using: composite
  steps:
    - name: Install the development packages
      shell: bash
      run: |
        dnf -y install dnf5-plugins
        dnf -y copr enable sdegler/hyprland
        dnf -y install git python3 $(sed -n 's/^additional_packages="\(.*\)"$/\1/p' distrobox.ini)
