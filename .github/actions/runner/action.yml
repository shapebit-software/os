# What every job here needs from a GitHub-hosted runner: disk space for images,
# disks and media, without its preinstalled toolchains and images, which no
# job uses; Docker with the containerd image store; GHCR, with the job's token,
# whose permissions (packages: read or write) decide what it may do there; and,
# for the VMs, KVM. QEMU, its firmware, and the software TPM are in the
# development image (image/Containerfile), where make runs.
name: Runner
description: Prepare the runner for ShapeBit's builds and machines
inputs:
  kvm:
    description: Open KVM to the job, for the VMs
    default: "false"
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        docker image prune -af >/dev/null
        df -h /

    # Docker's older image store saves layers uncompressed, which doubles the
    # payload on the medium, so that it no longer fits. It also seems unable to
    # push what the build saved intact. Developers' Docker 29 uses this one.
    - name: Use the containerd image store
      shell: bash
      run: |
        config=/etc/docker/daemon.json
        { sudo cat "$config" 2>/dev/null || echo '{}'; } |
          jq '.features["containerd-snapshotter"] = true' >"$RUNNER_TEMP/daemon.json"
        sudo cp "$RUNNER_TEMP/daemon.json" "$config"
        sudo systemctl restart docker

    # skopeo, here and in the development image, reads Docker's login.
    - name: Log in to GHCR
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
      run: docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN"

    - name: Open KVM to the job
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
