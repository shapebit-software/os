# What a job needs to run this repository's VMs: disk space, and access to
# KVM. QEMU, its firmware, and the software TPM are in the development image
# (development/Containerfile), where make runs the VMs.
name: VM host
description: Prepare the runner to boot ShapeBit in QEMU
runs:
  using: composite
  steps:
    - uses: ./.github/actions/image-store
    # The disks need about 30 GB; the runner's preinstalled toolchains are not used.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        docker image prune -af >/dev/null
        df -h /
    - name: Open KVM to the job
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
