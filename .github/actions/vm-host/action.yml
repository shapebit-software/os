# What a job needs to run this repository's VMs: disk space, QEMU, Secure Boot
# firmware, a software TPM, and access to KVM.
name: VM host
description: Prepare the runner to boot ShapeBit in QEMU
runs:
  using: composite
  steps:
    # The disks need about 30 GB; the runner's preinstalled toolchains are not used.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        docker image prune -af >/dev/null
        df -h /
    - name: Install QEMU, firmware, and a software TPM
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -qy qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools zstd
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
