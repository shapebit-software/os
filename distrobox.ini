[shapebit-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
start_now=false
init=false
# Fedora 44 has Quickshell but not Hyprland; this COPR is for development only.
pre_init_hooks="dnf -y install dnf5-plugins && dnf -y copr enable sdegler/hyprland"
# foot (a terminal), Epiphany (a browser), and Thunar (a file manager) are
# applications to open inside the desktop under development; grim, slurp, and
# wf-recorder capture the screen; hypridle handles idle time and sleep;
# clipman keeps copied text; JetBrains Mono is the shell's monospaced font.
# make run gives the desktop a session bus of its own (dbus-daemon) with the
# portals (xdg-desktop-portal, Hyprland's), and the Portal Tester (GTK 3,
# cairo) asks them. The container shares the host's home folder and session
# bus, so not Firefox, whose profile the host's may use, nor Nautilus, which
# the host's GNOME owns on that bus.
additional_packages="cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtwayland libxkbcommon-devel dbus-daemon make hyprland hypridle clipman quickshell qt6-qtdeclarative-devel mesa-dri-drivers foot epiphany Thunar grim slurp wf-recorder xdg-user-dirs jetbrains-mono-fonts xdg-desktop-portal xdg-desktop-portal-hyprland gtk3 python3-gobject python3-cairo"
