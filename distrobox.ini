[shapebit-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
start_now=false
init=false
# Fedora 44 has Quickshell but not Hyprland; this COPR is for development only.
pre_init_hooks="dnf -y install dnf5-plugins && dnf -y copr enable sdegler/hyprland"
# foot is a terminal to open inside the desktop under development; grim,
# slurp, and wf-recorder capture the screen; JetBrains Mono is the shell's
# monospaced font.
additional_packages="cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtwayland libxkbcommon-devel dbus-daemon make hyprland quickshell qt6-qtdeclarative-devel mesa-dri-drivers foot grim slurp wf-recorder xdg-user-dirs jetbrains-mono-fonts"
