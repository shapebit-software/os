# The login screen takes the screen from the boot splash without a black
# frame or the console between them, as GDM does: Plymouth lets go of the
# display but leaves its last picture, which stays until the greeter draws.
# plymouth-quit.service would clear the screen first, so it does not run.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
