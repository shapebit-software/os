[pytest]
# Every test's settings (packages/testing/README.md): a test's markers say its
# level, and the testing plugin holds it to it: none, a unit test;
# integration; or one system_* marker, which says the machine it runs on.
# testing.fixtures has what integration tests share; pytester tests the plugin
# itself. Tests import by file, not by folder on the path, so a package's tests
# may share names with another's. Testinfra is a library here: its plugin's own
# host fixture would test this machine.
addopts = -ra --tb=short -v --strict-markers --import-mode=importlib -p testing.plugin -p testing.fixtures -p pytester
  -p no:pytest11.testinfra -p no:cacheprovider
pythonpath = packages/testing/src
markers =
    integration: a program whole, on this computer, against made-up services (make test-integration)
    system_installed: the installed, running system (make test-system)
    system_image: a container of the image, where nothing boots (make test-system-image)
    system_installer: the booted installer medium, before it installs (make test-system-installer)
    system_update: around an update and a rollback (make test-system-update)
