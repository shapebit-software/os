[pytest]
# Every test's settings (packages/testing/README.md): the folder a test is in,
# tests/LEVEL/, says its level, and the testing plugin holds it to it; a system
# test's one marker says the machine it runs on. testing.fixtures has what
# integration tests share; pytester tests the plugin itself. Tests import by
# file, not by folder on the path, so the levels of one feature may have tests
# of the same name. Testinfra is a library here: its plugin's own host fixture
# would test this machine.
addopts = -ra --tb=short -v --strict-markers --import-mode=importlib -p testing.plugin -p testing.fixtures -p pytester
  -p no:pytest11.testinfra -p no:cacheprovider
pythonpath = packages/testing/src
testing_layout = strict
markers =
    system_installed: the installed, running system (make test-system)
    system_image: a container of the image, where nothing boots (make test-system-image)
    system_installer: the booted installer medium, before it installs (make test-system-installer)
    system_update: around an update and a rollback (make test-system-update)
