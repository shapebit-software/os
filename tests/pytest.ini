[pytest]
addopts = -ra --tb=short -v --strict-markers
markers =
    before_reboot: the part of a persistence check that runs before the reboot
    after_reboot: the part of a persistence check that runs after the reboot
    switched: update, first boot: the system switches to the new build
    updated: update, second boot: runs the new build and stages a newer one
    downloaded: update, third boot: runs the newer build and rolls back
    rolled_back: update, fourth boot: runs the build before
