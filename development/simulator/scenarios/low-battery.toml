# The laptop with its battery nearly empty, in power saver.
extends = "laptop"

[upower]
parameters = { OnBattery = true }
calls = [
  { method = "AddDischargingBattery", args = ["BAT0", "Battery", 6.0, 600] },
  # 10 minutes to empty, and the critical warning (4).
  { method = "SetupDisplayDevice", args = [2, 2, 6.0, 3.0, 50.0, 18.0, 600, 0, true, "battery-caution-symbolic", 4] },
]

[upower_power_profiles_daemon]
parameters = { ActiveProfile = "power-saver" }
